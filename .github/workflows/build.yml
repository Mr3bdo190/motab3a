name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files
        run: flutter create . --platforms android --org com.motab3a --project-name motab3a

      - name: Fix applicationId
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = ".*"/applicationId = "com.motab3a.mr"/' android/app/build.gradle.kts
            sed -i 's/namespace = ".*"/namespace = "com.motab3a.mr"/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId ".*"/applicationId "com.motab3a.mr"/' android/app/build.gradle
            sed -i 's/namespace ".*"/namespace "com.motab3a.mr"/' android/app/build.gradle
          fi

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Patch Gradle for Firebase and SDK 35
        run: |
          cat << 'PYEOF' > fix_gradle.py
          import os
          import re

          def patch_file(path, pattern, replacement, count=1):
              if not os.path.exists(path): return
              with open(path, 'r') as f: content = f.read()
              content = re.sub(pattern, replacement, content, count=count)
              with open(path, 'w') as f: f.write(content)

          # 1. Patch Settings (Kotlin DSL) for Google Services
          patch_file('android/settings.gradle.kts', r'(plugins\s*\{)', r'\1\n    id("com.google.gms.google-services") version "4.4.0" apply false')

          # 2. Patch Root Build (Groovy) for Google Services
          patch_file('android/build.gradle', r'(classpath\s+["\']com\.android\.tools\.build:gradle)', r'classpath "com.google.gms:google-services:4.4.0"\n        \1')

          # 3. Patch App Build (Kotlin DSL) for Google Services
          patch_file('android/app/build.gradle.kts', r'(id\("com\.android\.application"\))', r'\1\n    id("com.google.gms.google-services")')

          # 4. Patch App Build (Groovy) for Google Services
          if os.path.exists('android/app/build.gradle'):
              with open('android/app/build.gradle', 'r') as f: content = f.read()
              if 'com.google.gms.google-services' not in content:
                  with open('android/app/build.gradle', 'a') as f: f.write('\napply plugin: "com.google.gms.google-services"\n')

          # 5. Update compileSdk to 35 (Kotlin DSL)
          if os.path.exists('android/app/build.gradle.kts'):
              with open('android/app/build.gradle.kts', 'r') as f: content = f.read()
              content = content.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 35')
              content = content.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 35')
              content = content.replace('compileSdk = 33', 'compileSdk = 35')
              with open('android/app/build.gradle.kts', 'w') as f: f.write(content)

          # 6. Update compileSdk to 35 (Groovy)
          if os.path.exists('android/app/build.gradle'):
              with open('android/app/build.gradle', 'r') as f: content = f.read()
              content = content.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 35')
              content = content.replace('compileSdk flutter.compileSdkVersion', 'compileSdk 35')
              content = content.replace('compileSdkVersion 33', 'compileSdkVersion 35')
              content = content.replace('compileSdk 33', 'compileSdk 35')
              with open('android/app/build.gradle', 'w') as f: f.write(content)
          PYEOF
          python3 fix_gradle.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
