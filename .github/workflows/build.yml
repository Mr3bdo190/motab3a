name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files
        run: flutter create . --platforms android --org com.motab3a --project-name motab3a

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Patch Gradle for Firebase and SDK 34
        run: |
          cat << 'PYEOF' > fix_gradle.py
          import os
          import re

          # 1. دالة لتعديل ملفات Gradle
          def patch_file(path, pattern, replacement):
              if not os.path.exists(path): return
              with open(path, 'r') as f: content = f.read()
              content = re.sub(pattern, replacement, content)
              with open(path, 'w') as f: f.write(content)

          # 2. ضبط applicationId و namespace
          patch_file('android/app/build.gradle.kts', r'(applicationId\s*=\s*")[^"]*(")', r'\1com.motab3a.mr\2')
          patch_file('android/app/build.gradle.kts', r'(namespace\s*=\s*")[^"]*(")', r'\1com.motab3a.mr\2')
          patch_file('android/app/build.gradle', r'(applicationId\s+")[^"]*(")', r'\1com.motab3a.mr\2')
          patch_file('android/app/build.gradle', r'(namespace\s+")[^"]*(")', r'\1com.motab3a.mr\2')

          # 3. إضافة Google Services Plugin
          patch_file('android/settings.gradle.kts', r'(plugins\s*\{)', r'\1\n    id("com.google.gms.google-services") version "4.4.0" apply false')
          patch_file('android/build.gradle', r'(classpath\s+["\']com\.android\.tools\.build:gradle)', r'classpath "com.google.gms:google-services:4.4.0"\n        \1')
          patch_file('android/app/build.gradle.kts', r'(id\("com\.android\.application"\))', r'\1\n    id("com.google.gms.google-services")')
          if os.path.exists('android/app/build.gradle'):
              with open('android/app/build.gradle', 'r') as f: content = f.read()
              if 'com.google.gms.google-services' not in content:
                  with open('android/app/build.gradle', 'a') as f: f.write('\napply plugin: "com.google.gms.google-services"\n')

          # 4. إجبار compileSdk و targetSdk على الإصدار 34
          for path in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if not os.path.exists(path): continue
              with open(path, 'r') as f: content = f.read()
              content = re.sub(r'compileSdk(Version)?\s*[=]?\s*.*', 'compileSdk 34', content)
              content = re.sub(r'targetSdk(Version)?\s*[=]?\s*.*', 'targetSdk 34', content)
              with open(path, 'w') as f: f.write(content)
          PYEOF
          python3 fix_gradle.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
